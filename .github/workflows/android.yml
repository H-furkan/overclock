name: Build Android APK

# APK'yı bulutta derler — yerel Android Studio gerekmez.
# Elle tetikle (Actions sekmesi → Run workflow) ya da APK dosyaları değişince otomatik.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'capacitor-www/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Gerçek geri-sayım: bildirimi her saniye yeniden post etmek (eski yöntem) bazı
      # cihazlarda bildirimi kaybolup-yeniden-düşüyor gösteriyordu + arkaplandaki webview
      # interval'i OS tarafından donduruluyor. Bunun yerine bildirimi TEK SEFER basıp
      # Android'in KENDİ kronometresine saydırıyoruz. @capacitor/local-notifications v6
      # bunu desteklemediği için plugin'in buildNotification'ına extra.chronoWhen okuyan
      # bir blok enjekte ediyoruz. Sürüm package.json'da 6.1.0'a pinlendi (anchor sabit).
      - name: Patch LocalNotifications for live count-down chronometer
        run: |
          set -eux
          LNF=node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications/LocalNotificationManager.java
          test -f "$LNF"
          ANCHOR='.setGroupSummary(localNotification.isGroupSummary());'
          grep -qF "$ANCHOR" "$LNF"   # anchor yoksa build burada patlar (sessiz no-op değil)
          printf '%s\n' \
            '        // OVERCLOCK_CHRONO_PATCH: system-ticked count-down timer shown BIG in the body' \
            '        // via a custom RemoteViews layout (oc_ongoing) with a <Chronometer> view.' \
            '        // Falls back to the small corner chronometer if the layout is missing.' \
            '        try {' \
            '            com.getcapacitor.JSObject _ocx = localNotification.getExtra();' \
            '            if (_ocx != null && _ocx.has("chronoWhen")) {' \
            '                long _ocw = _ocx.getLong("chronoWhen");' \
            '                boolean _occd = _ocx.optBoolean("chronoCountdown", true);' \
            '                android.content.Context _occtx = this.context;' \
            '                String _ocpkg = _occtx.getPackageName();' \
            '                int _oclay = _occtx.getResources().getIdentifier("oc_ongoing", "layout", _ocpkg);' \
            '                if (_oclay != 0 && android.os.Build.VERSION.SDK_INT >= 24) {' \
            '                    int _idT = _occtx.getResources().getIdentifier("oc_title", "id", _ocpkg);' \
            '                    int _idC = _occtx.getResources().getIdentifier("oc_chrono", "id", _ocpkg);' \
            '                    int _idB = _occtx.getResources().getIdentifier("oc_body", "id", _ocpkg);' \
            '                    android.widget.RemoteViews _ocrv = new android.widget.RemoteViews(_ocpkg, _oclay);' \
            '                    _ocrv.setTextViewText(_idT, localNotification.getTitle());' \
            '                    _ocrv.setTextViewText(_idB, localNotification.getBody());' \
            '                    long _ocbase = android.os.SystemClock.elapsedRealtime() + (_ocw - System.currentTimeMillis());' \
            '                    _ocrv.setChronometer(_idC, _ocbase, "%s", true);' \
            '                    _ocrv.setChronometerCountDown(_idC, _occd);' \
            '                    mBuilder.setStyle(new androidx.core.app.NotificationCompat.DecoratedCustomViewStyle());' \
            '                    mBuilder.setCustomContentView(_ocrv);' \
            '                    mBuilder.setCustomBigContentView(_ocrv);' \
            '                } else {' \
            '                    mBuilder.setWhen(_ocw);' \
            '                    mBuilder.setShowWhen(true);' \
            '                    mBuilder.setUsesChronometer(true);' \
            '                    if (android.os.Build.VERSION.SDK_INT >= 24) mBuilder.setChronometerCountDown(_occd);' \
            '                }' \
            '            }' \
            '        } catch (Exception _oce) {}' > /tmp/chrono.txt
          awk 'BEGIN{while((getline l < "/tmp/chrono.txt")>0) ins=ins l ORS}
               {print}
               index($0,".setGroupSummary(localNotification.isGroupSummary());") && !done {printf "%s",ins; done=1}' \
               "$LNF" > /tmp/LNF.java && mv /tmp/LNF.java "$LNF"
          grep -qF "OVERCLOCK_CHRONO_PATCH" "$LNF" || { echo "CHRONO PATCH FAILED — anchor matched but inject missing"; exit 1; }
          echo "── chronometer patch applied & verified ──"

      # Bildirim sesi 0 olsa bile seans alarmi CALSIN: 'oc_system_alarm' isaretli kanal
      # sistem varsayilan ALARM sesi + USAGE_ALARM (alarm ses kanali) ile olusturulur.
      # Boylece OVERCLOCK alarmi calar saat gibi davranir, diger bildirimler sessiz kalir.
      - name: Patch notification channel for ALARM audio stream
        run: |
          set -eux
          NCM=node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications/NotificationChannelManager.java
          test -f "$NCM"
          ANCHOR='String sound = channel.getString(CHANNEL_SOUND, null);'
          grep -qF "$ANCHOR" "$NCM"
          printf '%s\n' \
            '            // OVERCLOCK_ALARM_PATCH: sentinel routes this channel to the system ALARM stream' \
            '            if ("oc_system_alarm".equals(sound)) {' \
            '                AudioAttributes _ocAttrs = new AudioAttributes.Builder()' \
            '                    .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)' \
            '                    .setUsage(AudioAttributes.USAGE_ALARM)' \
            '                    .build();' \
            '                notificationChannel.setSound(android.provider.Settings.System.DEFAULT_ALARM_ALERT_URI, _ocAttrs);' \
            '                sound = null;' \
            '            }' > /tmp/alarmpatch.txt
          awk 'BEGIN{while((getline l < "/tmp/alarmpatch.txt")>0) ins=ins l ORS}
               {print}
               index($0,"String sound = channel.getString(CHANNEL_SOUND, null);") && !done {printf "%s",ins; done=1}' \
               "$NCM" > /tmp/NCM.java && mv /tmp/NCM.java "$NCM"
          grep -qF "OVERCLOCK_ALARM_PATCH" "$NCM" || { echo "ALARM PATCH FAILED"; exit 1; }
          echo "── alarm channel patch applied & verified ──"

      - name: Add Android platform
        run: npx cap add android

      # JS tarafinin yamali APK'yi tanimasi icin surum el sikismasi (App.getInfo().version)
      - name: Stamp android versionName (patch handshake)
        run: |
          set -eux
          GR=android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "7.2.1"/' "$GR"
          grep -q '7.2.1' "$GR"

      # PLAN C: gercek calar-saat alarmi + imza zili — bildirim sisteminden BAGIMSIZ.
      # OcAlarm (setAlarmClock) + OcAlarmReceiver (MediaPlayer, USAGE_ALARM) + res/raw/oc_bell.wav
      - name: Inject OcAlarm plugin (alarm-clock class bell)
        run: |
          set -eux
          PKG=com.hfurkan.overclock
          JDIR=android/app/src/main/java/com/hfurkan/overclock
          test -d "$JDIR"
          cp native/OcAlarm.java native/OcAlarmReceiver.java "$JDIR/"
          mkdir -p android/app/src/main/res/raw
          cp native/oc_bell.wav android/app/src/main/res/raw/oc_bell.wav
          MA="$JDIR/MainActivity.java"
          grep -q "registerPlugin(OcAlarm" "$MA" || sed -i 's/public class MainActivity extends BridgeActivity {/public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(OcAlarm.class);\n        super.onCreate(savedInstanceState);\n    }/' "$MA"
          grep -q "registerPlugin(OcAlarm" "$MA" || { echo "MainActivity patch FAILED"; exit 1; }
          MF=android/app/src/main/AndroidManifest.xml
          grep -q "OcAlarmReceiver" "$MF" || sed -i 's|</application>|    <receiver android:name=".OcAlarmReceiver" android:exported="false"/>\n    </application>|' "$MF"
          grep -q "OcAlarmReceiver" "$MF" || { echo "Manifest receiver FAILED"; exit 1; }
          echo "── OcAlarm injected ──"

      # Büyük gövde sayacı için özel bildirim düzeni (Chronometer view). Plugin patch'i
      # bunu runtime'da getIdentifier ile bulur; bulamazsa köşedeki küçük kronometreye düşer.
      # Chronometer'a textAppearance verilir → OEM'lerde "beyaz üstüne beyaz" görünmez yazı olmaz.
      - name: Inject custom ongoing-notification layout (big chronometer)
        run: |
          set -eux
          LAYDIR=android/app/src/main/res/layout
          mkdir -p "$LAYDIR"
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:layout_width="match_parent"' \
            '    android:layout_height="wrap_content"' \
            '    android:orientation="vertical"' \
            '    android:paddingTop="2dp"' \
            '    android:paddingBottom="2dp">' \
            '    <TextView android:id="@+id/oc_title"' \
            '        android:layout_width="match_parent"' \
            '        android:layout_height="wrap_content"' \
            '        android:textAppearance="@style/TextAppearance.Compat.Notification.Title"' \
            '        android:singleLine="true"/>' \
            '    <LinearLayout android:layout_width="match_parent"' \
            '        android:layout_height="wrap_content"' \
            '        android:orientation="horizontal"' \
            '        android:gravity="center_vertical"' \
            '        android:paddingTop="2dp">' \
            '        <Chronometer android:id="@+id/oc_chrono"' \
            '            android:layout_width="wrap_content"' \
            '            android:layout_height="wrap_content"' \
            '            android:textAppearance="@style/TextAppearance.Compat.Notification.Title"' \
            '            android:textSize="24sp"' \
            '            android:textStyle="bold"/>' \
            '        <TextView android:id="@+id/oc_body"' \
            '            android:layout_width="wrap_content"' \
            '            android:layout_height="wrap_content"' \
            '            android:layout_marginStart="10dp"' \
            '            android:textAppearance="@style/TextAppearance.Compat.Notification.Info"/>' \
            '    </LinearLayout>' \
            '</LinearLayout>' > "$LAYDIR/oc_ongoing.xml"
          test -f "$LAYDIR/oc_ongoing.xml"   # eksikse build patlasın (sessiz fallback değil)
          echo "── oc_ongoing.xml written ──"; cat "$LAYDIR/oc_ongoing.xml"

      - name: Generate Android icons & splash from resources/
        run: npx capacitor-assets generate --android

      # Android 12+ needs SCHEDULE_EXACT_ALARM / USE_EXACT_ALARM permissions for
      # LocalNotifications to fire AT EXACT TIMES (rather than batched / Doze-delayed).
      # Without these, long-scheduled session alarms (2h+) can drift or drop.
      - name: Inject exact-alarm permissions into AndroidManifest
        run: |
          set -eux
          MF=android/app/src/main/AndroidManifest.xml
          if ! grep -q "SCHEDULE_EXACT_ALARM" "$MF"; then
            sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MF" || true
            sed -i 's|<uses-permission android:name="android.permission.WAKE_LOCK"\s*/>|<uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>|' "$MF" || true
            # if WAKE_LOCK line did not exist, add the permissions before </manifest>
            if ! grep -q "SCHEDULE_EXACT_ALARM" "$MF"; then
              sed -i 's|</manifest>|    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>|' "$MF"
            fi
          fi
          echo "── AndroidManifest.xml ──"
          cat "$MF"

      - name: Sync Capacitor
        run: npx cap sync android

      # SABIT IMZA: debug keystore repoda tutulur (ilk calismada uretilip commit edilir).
      # Böylece her derleme AYNI imzayla cikar ve APK eskisinin UZERINE kurulabilir
      # (farkli imza = Android sessizce reddediyordu, kullanici eski surumde kaliyordu).
      - name: Ensure persistent debug keystore
        run: |
          set -eux
          if [ ! -f signing/debug.keystore ]; then
            mkdir -p signing
            keytool -genkeypair -v -keystore signing/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OVERCLOCK Debug,O=Overclock,C=TR"
            git config user.email "furkanhoroz125@gmail.com"
            git config user.name "H-furkan"
            git add signing/debug.keystore
            git commit -m "ci: kalici debug keystore (sabit APK imzasi)"
            git push
          fi
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk overclock.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-apk
          path: overclock.apk

      - name: Publish to "apk-latest" release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TAG=apk-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "OVERCLOCK APK (son sürüm)" \
              --notes "En güncel OVERCLOCK Android APK'sı. Aynı Firebase hesabıyla giriş yapınca veriler otomatik senkronlanır."
          fi
          # Drop any existing asset (ignore 404), then upload fresh.
          gh release delete-asset "$TAG" overclock.apk --yes 2>/dev/null || true
          gh release upload "$TAG" overclock.apk
          # verify
          gh release view "$TAG" --json assets -q '.assets[].name' | grep -q overclock.apk
