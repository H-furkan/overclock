name: Build Android APK

# APK'yı bulutta derler — yerel Android Studio gerekmez.
# Elle tetikle (Actions sekmesi → Run workflow) ya da APK dosyaları değişince otomatik.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'capacitor-www/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Gerçek geri-sayım: bildirimi her saniye yeniden post etmek (eski yöntem) bazı
      # cihazlarda bildirimi kaybolup-yeniden-düşüyor gösteriyordu + arkaplandaki webview
      # interval'i OS tarafından donduruluyor. Bunun yerine bildirimi TEK SEFER basıp
      # Android'in KENDİ kronometresine saydırıyoruz. @capacitor/local-notifications v6
      # bunu desteklemediği için plugin'in buildNotification'ına extra.chronoWhen okuyan
      # bir blok enjekte ediyoruz. Sürüm package.json'da 6.1.0'a pinlendi (anchor sabit).
      - name: Patch LocalNotifications for live count-down chronometer
        run: |
          set -eux
          LNF=node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications/LocalNotificationManager.java
          test -f "$LNF"
          ANCHOR='.setGroupSummary(localNotification.isGroupSummary());'
          grep -qF "$ANCHOR" "$LNF"   # anchor yoksa build burada patlar (sessiz no-op değil)
          printf '%s\n' \
            '        // OVERCLOCK_CHRONO_PATCH: system-ticked count-down timer in the notification' \
            '        try {' \
            '            com.getcapacitor.JSObject _ocx = localNotification.getExtra();' \
            '            if (_ocx != null && _ocx.has("chronoWhen") && android.os.Build.VERSION.SDK_INT >= 24) {' \
            '                long _ocw = _ocx.getLong("chronoWhen");' \
            '                mBuilder.setWhen(_ocw);' \
            '                mBuilder.setShowWhen(true);' \
            '                mBuilder.setUsesChronometer(true);' \
            '                mBuilder.setChronometerCountDown(_ocx.optBoolean("chronoCountdown", true));' \
            '            }' \
            '        } catch (Exception _oce) {}' > /tmp/chrono.txt
          awk 'BEGIN{while((getline l < "/tmp/chrono.txt")>0) ins=ins l ORS}
               {print}
               index($0,".setGroupSummary(localNotification.isGroupSummary());") && !done {printf "%s",ins; done=1}' \
               "$LNF" > /tmp/LNF.java && mv /tmp/LNF.java "$LNF"
          grep -qF "OVERCLOCK_CHRONO_PATCH" "$LNF" || { echo "CHRONO PATCH FAILED — anchor matched but inject missing"; exit 1; }
          echo "── chronometer patch applied & verified ──"

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons & splash from resources/
        run: npx capacitor-assets generate --android

      # Android 12+ needs SCHEDULE_EXACT_ALARM / USE_EXACT_ALARM permissions for
      # LocalNotifications to fire AT EXACT TIMES (rather than batched / Doze-delayed).
      # Without these, long-scheduled session alarms (2h+) can drift or drop.
      - name: Inject exact-alarm permissions into AndroidManifest
        run: |
          set -eux
          MF=android/app/src/main/AndroidManifest.xml
          if ! grep -q "SCHEDULE_EXACT_ALARM" "$MF"; then
            sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MF" || true
            sed -i 's|<uses-permission android:name="android.permission.WAKE_LOCK"\s*/>|<uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>|' "$MF" || true
            # if WAKE_LOCK line did not exist, add the permissions before </manifest>
            if ! grep -q "SCHEDULE_EXACT_ALARM" "$MF"; then
              sed -i 's|</manifest>|    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>|' "$MF"
            fi
          fi
          echo "── AndroidManifest.xml ──"
          cat "$MF"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk overclock.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-apk
          path: overclock.apk

      - name: Publish to "apk-latest" release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TAG=apk-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "OVERCLOCK APK (son sürüm)" \
              --notes "En güncel OVERCLOCK Android APK'sı. Aynı Firebase hesabıyla giriş yapınca veriler otomatik senkronlanır."
          fi
          # Drop any existing asset (ignore 404), then upload fresh.
          gh release delete-asset "$TAG" overclock.apk --yes 2>/dev/null || true
          gh release upload "$TAG" overclock.apk
          # verify
          gh release view "$TAG" --json assets -q '.assets[].name' | grep -q overclock.apk
