name: Build Android APK

# APK'yı bulutta derler — yerel Android Studio gerekmez.
# Elle tetikle (Actions sekmesi → Run workflow) ya da APK dosyaları değişince otomatik.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'capacitor-www/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons & splash from resources/
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk overclock.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-apk
          path: overclock.apk

      - name: Publish to "apk-latest" release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TAG=apk-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "OVERCLOCK APK (son sürüm)" \
              --notes "En güncel OVERCLOCK Android APK'sı. Aynı Firebase hesabıyla giriş yapınca veriler otomatik senkronlanır."
          fi
          # Drop any existing asset (ignore 404), then upload fresh.
          gh release delete-asset "$TAG" overclock.apk --yes 2>/dev/null || true
          gh release upload "$TAG" overclock.apk
          # verify
          gh release view "$TAG" --json assets -q '.assets[].name' | grep -q overclock.apk
