name: Build Android APK

# APK'yı bulutta derler — yerel Android Studio gerekmez.
# Elle tetikle (Actions sekmesi → Run workflow) ya da APK dosyaları değişince otomatik.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'capacitor-www/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Our committed android/ contains only OGMPlugin.kt; stash it so cap add
      # can generate the full project skeleton, then restore the plugin.
      - name: Stash custom android overrides
        run: |
          if [ -d android ]; then
            mkdir -p /tmp/android-overrides
            cp -r android/* /tmp/android-overrides/ || true
            rm -rf android
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Merge OGMPlugin into android project
        run: |
          if [ -d /tmp/android-overrides ]; then
            cp -rv /tmp/android-overrides/* android/
          fi
          ls android/app/src/main/java/com/hfurkan/overclock/

      # cap add android (Capacitor 6) ships a Java MainActivity. Our plugin is
      # Kotlin, so we (a) drop the Java file, (b) write a Kotlin MainActivity that
      # registers OGMPlugin, (c) make sure the Kotlin Gradle plugin is applied in
      # the app module so the .kt files actually compile.
      - name: Convert MainActivity to Kotlin and register OGMPlugin
        run: |
          set -euxo pipefail
          PKG_DIR=android/app/src/main/java/com/hfurkan/overclock
          rm -f "$PKG_DIR/MainActivity.java"
          cat > "$PKG_DIR/MainActivity.kt" <<'EOF'
          package com.hfurkan.overclock

          import android.os.Bundle
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  registerPlugin(OGMPlugin::class.java)
                  super.onCreate(savedInstanceState)
              }
          }
          EOF
          echo "── MainActivity.kt ──"
          cat "$PKG_DIR/MainActivity.kt"
          echo "── PKG_DIR contents ──"
          ls -la "$PKG_DIR"

      - name: Enable Kotlin in app module
        run: |
          set -euxo pipefail
          APP_GRADLE=android/app/build.gradle
          if ! grep -q "kotlin-android" "$APP_GRADLE"; then
            sed -i "s|apply plugin: 'com.android.application'|apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'|" "$APP_GRADLE"
          fi
          # add kotlin-stdlib dependency if missing
          if ! grep -q "kotlin-stdlib" "$APP_GRADLE"; then
            sed -i "s|dependencies {|dependencies {\n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:1.9.10\"|" "$APP_GRADLE"
          fi
          # ensure kotlin gradle plugin is in classpath at project level
          ROOT_GRADLE=android/build.gradle
          if ! grep -q "kotlin-gradle-plugin" "$ROOT_GRADLE"; then
            sed -i "s|classpath 'com.android.tools.build:gradle.*|&\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'|" "$ROOT_GRADLE"
          fi
          echo "── app/build.gradle (head) ──"
          head -40 "$APP_GRADLE"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk overclock.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-apk
          path: overclock.apk

      - name: Publish to "apk-latest" release (gh CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=apk-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" overclock.apk --clobber
          else
            gh release create "$TAG" overclock.apk \
              --title "OVERCLOCK APK (son sürüm)" \
              --notes "En güncel OVERCLOCK Android APK'sı. Telefon ve tablete kur (bilinmeyen kaynaklara izin ver). Aynı Firebase hesabıyla giriş yapınca veriler otomatik senkronlanır."
          fi
