name: Build Android APK

# APK'yı bulutta derler — yerel Android Studio gerekmez.
# Elle tetikle (Actions sekmesi → Run workflow) ya da APK dosyaları değişince otomatik.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'capacitor-www/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Our committed android/ contains only OGMPlugin.kt; stash it so cap add
      # can generate the full project skeleton, then restore the plugin.
      - name: Stash custom android overrides
        run: |
          if [ -d android ]; then
            mkdir -p /tmp/android-overrides
            cp -r android/* /tmp/android-overrides/ || true
            rm -rf android
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Merge OGMPlugin into android project
        run: |
          if [ -d /tmp/android-overrides ]; then
            cp -rv /tmp/android-overrides/* android/
          fi
          ls android/app/src/main/java/com/hfurkan/overclock/

      - name: Register OGMPlugin in MainActivity
        run: |
          MA=android/app/src/main/java/com/hfurkan/overclock/MainActivity.kt
          # If the class body is empty (default cap add template) replace it
          if grep -q 'class MainActivity : BridgeActivity()' "$MA"; then
            cat > "$MA" <<'EOF'
          package com.hfurkan.overclock

          import android.os.Bundle
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  registerPlugin(OGMPlugin::class.java)
                  super.onCreate(savedInstanceState)
              }
          }
          EOF
          fi
          echo "── MainActivity.kt ──"
          cat "$MA"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk overclock.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overclock-apk
          path: overclock.apk

      - name: Publish to "apk-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: OVERCLOCK APK (son sürüm)
          body: |
            En güncel OVERCLOCK Android APK'sı.
            Telefon ve tablete kur (bilinmeyen kaynaklara izin ver). Aynı Firebase hesabıyla giriş yapınca veriler otomatik senkronlanır.
          files: overclock.apk
          prerelease: false
